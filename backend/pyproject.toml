[project]
name = "logtrace-ai-backend"
version = "0.1.0"
description = "LogTrace AI - Cybersecurity Log Analysis Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "watchfiles>=0.21.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "email-validator>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]